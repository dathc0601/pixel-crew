[package]
name = "pixel-crew-desktop"
version = "0.1.0"
edition = "2021"

# Keep the Tauri crates on the same minor versions as the npm packages
# (@tauri-apps/api, cli and plugin-*): `tauri build` refuses mismatched minors.
[dependencies]
tauri = { version = "~2.10", features = ["tray-icon"] }
tauri-plugin-shell = "~2.3"
tauri-plugin-autostart = "~2.5"
tauri-plugin-notification = "~2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "~2.5", features = [] }
