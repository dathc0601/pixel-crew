name: Desktop builds

# Builds unsigned desktop installers for macOS, Windows and Linux.
# - With a release tag (a pushed vX.Y.Z tag, the `tag` input, or a call from
#   release-please.yml) the installers are attached to that GitHub release. A pushed tag
#   without a release gets a draft release, so a stray tag never publishes anything.
# - Without a tag (manual run) they are uploaded as workflow artifacts only.
# This workflow never creates tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the installers to (leave empty for artifacts only)
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the installers to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  release:
    name: Find the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.find.outputs.id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "No tag: installers become workflow artifacts only."
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Pixel Crew $RELEASE_TAG"
          fi
          echo "id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write # upload installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            rust-target: ""
            args: ""
          - name: linux-x64
            os: ubuntu-22.04
            rust-target: ""
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand (scripts/build-desktop.mjs) builds the web UI and the gateway
      # bundle. Node.js is not bundled: the app runs on the user's Node.js 22+.
      # With releaseId set, tauri-action uploads the installers to that release.
      - name: Build the app (unsigned)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}

      - name: Installer sizes
        shell: bash
        run: |
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec ls -l {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-crew-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
