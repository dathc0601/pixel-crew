name: Release

# release-please keeps a "chore: release x.y.z" pull request open on master. It bumps the
# version in every package file and writes CHANGELOG.md from the Conventional Commits since
# the last release. Merging that pull request tags vX.Y.Z and publishes the GitHub release;
# the jobs below then attach the desktop installers and (only when the NPM_TOKEN secret
# exists) publish the npm package. Nothing here runs on a schedule or on other branches.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Pull requests opened with the default token do not start CI. An optional
          # fine-grained token (contents + pull requests: read/write) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
